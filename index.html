<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工作知識庫</title>
  <style>
    :root{--ink:#202936;--muted:#667085;--paper:#f7f8fa;--surface:#fff;--line:#e6e9ef;--navy:#102a43;--blue:#246bce;--mint:#e6f6f1;--code:#111b2a}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:ui-sans-serif,"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;line-height:1.55}.shell{max-width:1120px;margin:auto;padding:30px 24px 56px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:26px}.brand{font-weight:700;font-size:20px;color:var(--navy)}.brand b{display:inline-grid;place-items:center;width:32px;height:32px;margin-right:9px;border-radius:9px;background:var(--navy);color:#fff}.date,.hint,.meta{color:var(--muted);font-size:14px}.hero{background:var(--navy);color:#fff;border-radius:20px;padding:34px 38px;margin-bottom:26px}.hero h1{margin:0 0 7px;font-size:32px}.hero p{margin:0;color:#d8e4ef}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.tab{font:inherit;border:1px solid var(--line);border-radius:999px;padding:9px 16px;background:var(--surface);cursor:pointer}.tab.active{background:var(--blue);border-color:var(--blue);color:#fff}.panel{display:none}.panel.active{display:block}.grid{display:grid;grid-template-columns:1.05fr .95fr;gap:20px}.card{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:23px}.card h2{margin:0 0 14px;color:var(--navy);font-size:18px}.card h3{margin:6px 0;font-size:16px}.summary{white-space:pre-wrap}.log{padding:14px 0;border-bottom:1px solid var(--line)}.log:last-child{border:0}.services{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.services p{color:var(--muted);font-size:14px}.tools{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}.tools input,.tools select{font:inherit;padding:10px;border:1px solid #d0d5dd;border-radius:8px;background:#fff}.tools input{flex:1;min-width:190px}.code-list{display:grid;gap:14px}.code-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}.code-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px}.tag{font-size:12px;border-radius:999px;padding:3px 8px;background:var(--mint);color:#176b53;margin-left:8px}.copy{font:inherit;font-size:12px;border:1px solid #d0d5dd;border-radius:7px;background:#fff;padding:5px 9px;cursor:pointer}.code-card pre{overflow:auto;margin:0;padding:16px 18px;background:var(--code);color:#d7e5f3;font-size:13px}.notice{border-left:4px solid var(--blue);padding:12px 14px;background:#edf5ff;border-radius:4px}.error{color:#9b1c1c}@media(max-width:720px){.shell{padding:20px 14px}.top{align-items:flex-start;flex-direction:column}.hero{padding:26px 22px}.hero h1{font-size:26px}.grid,.services{grid-template-columns:1fr}}
  </style>
</head>
<body><main class="shell">
  <header class="top"><div class="brand"><b>K</b>工作知識庫</div><div><a class="date" href="admin.html">管理內容</a>　<span id="today" class="date"></span></div></header>
  <section class="hero"><h1 id="headline">載入中…</h1><p id="intro"></p></section>
  <nav class="tabs" aria-label="內容分類"><button class="tab active" data-tab="daily">每日工作摘要</button><button class="tab" data-tab="business">業務介紹</button><button class="tab" data-tab="code">程式碼庫</button></nav>
  <section class="panel active" id="daily"><div class="grid"><article class="card"><h2>最新摘要</h2><div id="latest"></div></article><aside class="card"><h2>線上更新方式</h2><div class="notice">在 GitHub 開啟 <code>data/knowledge.json</code>，按鉛筆圖示修改內容，再按 Commit changes 儲存。GitHub Pages 會自動更新網站。</div><p class="hint">可編輯工作摘要、業務介紹與程式碼；不需要安裝任何程式。</p></aside></div><article class="card" style="margin-top:20px"><h2>近期紀錄</h2><div id="logs"></div></article></section>
  <section class="panel" id="business"><div class="services" id="services"></div><article class="card" style="margin-top:20px"><h2>服務說明</h2><p id="business-intro"></p></article></section>
  <section class="panel" id="code"><div class="tools"><input id="search" type="search" placeholder="搜尋程式碼、說明或關鍵字"><select id="language"><option value="all">所有語言</option><option value="VBA">VBA</option><option value="Power Query M">Power Query M</option><option value="Python">Python</option></select></div><div id="code-list" class="code-list"></div></section>
</main><script>
  const $=s=>document.querySelector(s), escape=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));let data;
  $('#today').textContent=new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'short'}).format(new Date());
  function render(){ $('#headline').textContent=data.business.headline;$('#intro').textContent=data.business.intro;$('#business-intro').textContent=data.business.intro;const logs=[...data.workLogs].sort((a,b)=>b.date.localeCompare(a.date));$('#latest').innerHTML=logs.length?`<strong>${escape(logs[0].title)}</strong><div class="meta">${escape(logs[0].date)}</div><p class="summary">${escape(logs[0].note)}</p>`:'尚無工作摘要。';$('#logs').innerHTML=logs.map(x=>`<div class="log"><strong>${escape(x.title)}</strong><div class="meta">${escape(x.date)}</div><div class="summary">${escape(x.note)}</div></div>`).join('');$('#services').innerHTML=data.business.services.map(x=>`<article class="card"><h3>${escape(x.title)}</h3><p>${escape(x.text)}</p></article>`).join('');renderCode(); }
  function renderCode(){if(!data)return;const q=$('#search').value.toLowerCase(),lang=$('#language').value;const items=data.snippets.filter(x=>(lang==='all'||x.language===lang)&&(`${x.language} ${x.title} ${x.description} ${x.code}`).toLowerCase().includes(q));$('#code-list').innerHTML=items.length?items.map((x,i)=>`<article class="code-card"><div class="code-head"><div><strong>${escape(x.title)}</strong><span class="tag">${escape(x.language)}</span><div class="hint">${escape(x.description)}</div></div><button class="copy" data-index="${i}">複製</button></div><pre><code>${escape(x.code)}</code></pre></article>`).join(''):'<p class="hint">找不到相符內容。</p>';document.querySelectorAll('.copy').forEach(b=>b.onclick=async()=>{await navigator.clipboard.writeText(items[b.dataset.index].code);b.textContent='已複製';setTimeout(()=>b.textContent='複製',1200)});}
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.tab).classList.add('active')});$('#search').oninput=renderCode;$('#language').onchange=renderCode;
  fetch('data/knowledge.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(json=>{data=json;render()}).catch(()=>{$('#headline').textContent='無法載入內容';$('#intro').innerHTML='<span class="error">請透過 GitHub Pages 開啟網站，或在本機啟動網站伺服器。</span>'});
</script></body></html>
