<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>管理內容｜工作知識庫</title>
  <style>
    :root{--ink:#202936;--muted:#667085;--paper:#f7f8fa;--surface:#fff;--line:#e6e9ef;--navy:#102a43;--blue:#246bce;--danger:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:ui-sans-serif,"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;line-height:1.5}.shell{max-width:980px;margin:auto;padding:30px 20px 60px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:22px}.top a{color:var(--blue);text-decoration:none}.hero{background:var(--navy);color:#fff;border-radius:18px;padding:27px 32px;margin-bottom:20px}.hero h1{font-size:27px;margin:0 0 5px}.hero p{margin:0;color:#d8e4ef}.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;margin:16px 0}.card h2{font-size:18px;margin:0 0 16px;color:var(--navy)}.connection{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{grid-column:1/-1}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:13px;font-weight:600;margin-bottom:5px;color:#475467}input,textarea,select{width:100%;font:inherit;border:1px solid #d0d5dd;border-radius:8px;padding:10px;background:#fff}textarea{min-height:88px;resize:vertical}.entry{border-top:1px solid var(--line);padding:17px 0}.entry:first-of-type{border-top:0;padding-top:0}.row{display:flex;gap:9px;align-items:center;justify-content:space-between;flex-wrap:wrap}.btn{font:inherit;border:1px solid #d0d5dd;border-radius:8px;padding:8px 12px;background:#fff;cursor:pointer}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600}.btn.danger{color:var(--danger);border-color:#fecdca}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;bottom:10px;padding:14px 0}.status{font-size:14px;color:var(--muted)}.status.error{color:var(--danger)}.tip{font-size:14px;color:var(--muted)}code{font-family:ui-monospace,Consolas,monospace}@media(max-width:620px){.connection,.form-grid{grid-template-columns:1fr}.wide{grid-column:auto}.shell{padding:20px 13px}.hero{padding:23px}.top{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body><main class="shell">
  <header class="top"><a href="index.html">← 返回知識庫</a><span class="tip">內容會直接儲存至 GitHub</span></header>
  <section class="hero"><h1>內容管理</h1><p>用表單管理工作摘要、業務介紹與程式碼。儲存後網站將自動更新。</p></section>
  <section class="card"><h2>連接 GitHub</h2><div class="connection"><div><label for="owner">GitHub 帳號或組織名稱</label><input id="owner" placeholder="例如 alanchen"></div><div><label for="repo">Repository 名稱</label><input id="repo" placeholder="例如 knowledge-hub"></div><div><label for="branch">分支</label><input id="branch" value="main"></div><div><label for="token">Fine-grained personal access token</label><input id="token" type="password" autocomplete="off" placeholder="貼上只限此 Repository 的 token"></div></div><p class="tip">Token 僅用於本次儲存，不會寫入網站或儲存在瀏覽器。建立 token 時只需授予此 Repository 的 <strong>Contents: Read and write</strong> 權限。</p><button class="btn primary" id="load">載入目前內容</button></section>
  <div id="editor" hidden>
    <section class="card"><h2>業務介紹</h2><div class="form-grid"><div class="wide"><label>首頁標題</label><input data-path="business.headline"></div><div class="wide"><label>簡介</label><textarea data-path="business.intro"></textarea></div></div><div id="services"></div><button class="btn" id="add-service">＋ 新增服務項目</button></section>
    <section class="card"><h2>每日工作摘要</h2><div id="logs"></div><button class="btn" id="add-log">＋ 新增工作摘要</button></section>
    <section class="card"><h2>程式碼庫</h2><div id="snippets"></div><button class="btn" id="add-snippet">＋ 新增程式碼</button></section>
    <div class="actions"><span id="status" class="status">內容已載入，尚未儲存。</span><button class="btn primary" id="save">儲存至 GitHub</button></div>
  </div>
</main><script>
  const $=s=>document.querySelector(s);let data,sha;
  const input=(label,value='',type='text')=>`<div><label>${label}</label>${type==='textarea'?`<textarea>${escape(value)}</textarea>`:`<input type="${type}" value="${escape(value)}">`}</div>`;
  const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const config=()=>({owner:$('#owner').value.trim(),repo:$('#repo').value.trim(),branch:$('#branch').value.trim(),token:$('#token').value.trim()});
  const api=()=>{const c=config();return `https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/contents/data/knowledge.json?ref=${encodeURIComponent(c.branch)}`};
  function service(item={title:'',text:''}){const e=document.createElement('div');e.className='entry service';e.innerHTML=`<div class="row"><strong>服務項目</strong><button class="btn danger remove">刪除</button></div><div class="form-grid">${input('標題',item.title)}${input('說明',item.text,'textarea')}</div>`;e.querySelector('.remove').onclick=()=>e.remove();return e}
  function log(item={date:new Date().toISOString().slice(0,10),title:'',note:''}){const e=document.createElement('div');e.className='entry log';e.innerHTML=`<div class="row"><strong>工作摘要</strong><button class="btn danger remove">刪除</button></div><div class="form-grid">${input('日期',item.date,'date')}${input('主題',item.title)}<div class="wide">${input('完成事項與待辦',item.note,'textarea')}</div></div>`;e.querySelector('.remove').onclick=()=>e.remove();return e}
  function snippet(item={language:'VBA',title:'',description:'',code:''}){const e=document.createElement('div');e.className='entry snippet';e.innerHTML=`<div class="row"><strong>程式碼</strong><button class="btn danger remove">刪除</button></div><div class="form-grid"><div><label>語言</label><select><option ${item.language==='VBA'?'selected':''}>VBA</option><option ${item.language==='Power Query M'?'selected':''}>Power Query M</option><option ${item.language==='Python'?'selected':''}>Python</option></select></div>${input('名稱',item.title)}<div class="wide">${input('用途說明',item.description,'textarea')}</div><div class="wide">${input('程式碼',item.code,'textarea')}</div></div>`;e.querySelector('.remove').onclick=()=>e.remove();return e}
  function render(){document.querySelectorAll('[data-path]').forEach(x=>{const [a,b]=x.dataset.path.split('.');x.value=data[a][b]});$('#services').replaceChildren(...data.business.services.map(service));$('#logs').replaceChildren(...data.workLogs.map(log));$('#snippets').replaceChildren(...data.snippets.map(snippet));$('#editor').hidden=false}
  function values(){data.business.headline=$('[data-path="business.headline"]').value.trim();data.business.intro=$('[data-path="business.intro"]').value.trim();data.business.services=[...document.querySelectorAll('.service')].map(e=>{const x=e.querySelectorAll('input,textarea');return{title:x[0].value.trim(),text:x[1].value.trim()}}).filter(x=>x.title||x.text);data.workLogs=[...document.querySelectorAll('.log')].map(e=>{const x=e.querySelectorAll('input,textarea');return{date:x[0].value,title:x[1].value.trim(),note:x[2].value.trim()}}).filter(x=>x.date&&x.title);data.snippets=[...document.querySelectorAll('.snippet')].map(e=>{const x=e.querySelectorAll('input,textarea,select');return{language:x[0].value,title:x[1].value.trim(),description:x[2].value.trim(),code:x[3].value}}).filter(x=>x.title&&x.code)}
  $('#add-service').onclick=()=>$('#services').append(service());$('#add-log').onclick=()=>$('#logs').append(log());$('#add-snippet').onclick=()=>$('#snippets').append(snippet());
  $('#load').onclick=async()=>{const c=config(),status=$('#status');if(!c.owner||!c.repo){status.textContent='請先填寫 GitHub 帳號與 Repository 名稱。';status.className='status error';return}status.textContent='正在載入…';status.className='status';try{const r=await fetch(api(),{headers:c.token?{Authorization:`Bearer ${c.token}`,Accept:'application/vnd.github+json'}:{Accept:'application/vnd.github+json'}});if(!r.ok)throw Error(r.status===404?'找不到 Repository 或資料檔':'無法連接 GitHub');const file=await r.json(),bytes=Uint8Array.from(atob(file.content.replace(/\n/g,'')),c=>c.charCodeAt(0));data=JSON.parse(new TextDecoder().decode(bytes));sha=file.sha;render();status.textContent='內容已載入。';}catch(e){status.textContent=e.message||'載入失敗，請檢查資料。';status.className='status error'}};
  $('#save').onclick=async()=>{const c=config(),status=$('#status');if(!data||!c.token){status.textContent='請先載入內容，並填寫有寫入權限的 token。';status.className='status error';return}values();status.textContent='正在儲存至 GitHub…';status.className='status';try{const bytes=new TextEncoder().encode(JSON.stringify(data,null,2)+"\n"),content=btoa(String.fromCharCode(...bytes));const r=await fetch(api(),{method:'PUT',headers:{Authorization:`Bearer ${c.token}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({message:'Update knowledge content',content,sha,branch:c.branch})});if(!r.ok)throw Error('儲存失敗，請確認 token 的 Contents 寫入權限。');const saved=await r.json();sha=saved.content.sha;status.textContent='已儲存。GitHub Pages 通常會在一兩分鐘內更新。';}catch(e){status.textContent=e.message||'儲存失敗。';status.className='status error'}};
</script></body></html>
